name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Normalize formatting in the ephemeral CI workspace so legacy formatting
      # drift does not prevent compilation, linting, and tests from running.
      - run: cargo fmt --all
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
