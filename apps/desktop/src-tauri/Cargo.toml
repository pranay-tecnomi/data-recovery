[package]
name = "data-recovery-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

recovery-engine = { path = "../../../crates/recovery-engine" }
recovery-core = { path = "../../../crates/recovery-core" }
storage-io = { path = "../../../crates/storage-io" }
partition-discovery = { path = "../../../crates/partition-discovery" }
filesystem-probe = { path = "../../../crates/filesystem-probe" }
fat32-recovery = { path = "../../../crates/fat32-recovery" }
exfat-recovery = { path = "../../../crates/exfat-recovery" }
apfs-recovery = { path = "../../../crates/apfs-recovery" }
candidate-pipeline = { path = "../../../crates/candidate-pipeline" }
recovery-output = { path = "../../../crates/recovery-output" }
file-carving = { path = "../../../crates/file-carving" }
